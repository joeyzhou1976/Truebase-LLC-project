<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
  body { font-family: Inter, Arial, sans-serif; }
  .canvas { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #fff; }
  .scene { background: #f8f8f7; }
  .scene .photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    filter: brightness(1.04) contrast(1.03);
  }
  .display {
    background:
      radial-gradient(ellipse at center 72%, rgba(0,0,0,.10), transparent 35%),
      linear-gradient(#fff, #fafafa);
  }
  .display .grid {
    position: absolute; inset: 8% 6% 10%;
    display: grid; gap: 22px; align-items: center; justify-items: center;
  }
  .display.count1 .grid { grid-template-columns: 1fr; }
  .display.count2 .grid { grid-template-columns: repeat(2, 1fr); }
  .display.count3 .grid { grid-template-columns: repeat(3, 1fr); }
  .display.count4 .grid, .display.count5 .grid, .display.count6 .grid, .display.count7 .grid { grid-template-columns: repeat(3, 1fr); }
  .display img {
    width: 100%; height: 100%; max-height: 430px; object-fit: contain;
    filter: brightness(1.06) contrast(1.04) drop-shadow(0 18px 28px rgba(0,0,0,.14));
  }
  .display.count1 img { max-height: 760px; }
  .display.count2 img { max-height: 650px; }
  .display.count4 img, .display.count5 img, .display.count6 img, .display.count7 img { max-height: 330px; }
  .rule { position: absolute; left: 5%; right: 5%; bottom: 5%; height: 1px; background: #eee; }
</style>
